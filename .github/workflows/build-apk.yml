name: Build HUNTARES CHEAT APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'native_huntares/**'
      - 'app/**'
      - 'build_termux.sh'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is not available on this runner}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install             'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Compile and sign APK
        shell: bash
        env:
          NDK_VERSION: 27.2.12479018
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export NDK_BUILD="$ANDROID_HOME/ndk/$NDK_VERSION/ndk-build"
          test -x "$NDK_BUILD"
          bash build_termux.sh
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HUNTARES-CHEAT-APK-v19
          path: build/HUNTARES_CHEAT_v19.apk
          if-no-files-found: error
