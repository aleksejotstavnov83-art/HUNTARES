name: Build HUNTARES TARGET LOADER v3.6 APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'reference_injector/**'
      - 'build.sh'
      - '.github/workflows/build-target-v36.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          bash build.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HUNTARES-TARGET-LOADER-v36-APK
          path: build/HUNTARES_TARGET_LOADER_v36.apk
          if-no-files-found: error
