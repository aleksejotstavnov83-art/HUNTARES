<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>HUNTARES SKINS</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#14161b;--line:#32343b;--fg:#f3f5f7;--sub:#a3a6af;--accent:#e4e4e6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px -apple-system,Roboto,'Helvetica Neue',sans-serif}header{position:sticky;top:0;z-index:3;background:#0b0d10ed;border-bottom:1px solid var(--line);padding:15px 12px 12px}h1{font-size:22px;letter-spacing:.16em;margin:0;font-weight:800}header p{font-size:11px;color:var(--sub);margin:7px 0 12px}input,select,button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px}input{width:100%;margin-bottom:9px}select{flex:1;min-width:140px}.toolbar{display:flex;gap:7px}.toolbar button{font-size:12px}.stat{padding:10px 12px;color:var(--sub);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px;padding:0 10px 24px}.tile{border:1px solid var(--line);background:var(--panel);border-radius:13px;overflow:hidden;position:relative;cursor:pointer}.tile.chosen{border-color:white;box-shadow:inset 0 0 0 1px #fff}.thumb{margin:9px auto 4px;width:128px;height:88px;max-width:100%;background-repeat:no-repeat}.caption{padding:5px 9px 11px;min-height:58px}.name{font-weight:700;overflow-wrap:anywhere}.cat,.id{color:var(--sub);font-size:11px;margin-top:3px}.id{color:#c9cad0}.favorite{position:absolute;right:7px;top:7px;z-index:1;background:#15171ac7;color:#eee;border:0;padding:5px 8px;font-size:17px}.favorite.on{color:#ffe5a3}#drawer{display:none;position:fixed;inset:0;background:#000b;z-index:5;align-items:end}#drawer.show{display:flex}#detail{width:100%;background:#1b1d23;border-radius:20px 20px 0 0;padding:20px}#detail h2{margin:0 0 6px;font-size:18px}#detail p{color:#bbb;word-break:break-word;line-height:1.4}#detail button{width:100%;margin-top:8px}.primary{background:#f4f4f4;color:#111;font-weight:800}.empty{padding:50px 20px;text-align:center;color:#999}.small{font-size:11px;color:#999}
</style></head><body><header><h1>HUNTARES SKINS</h1><p>Каталог иконок 1.1.0 · визуальный выбор · не меняет предметы в игре</p><input id="search" type="search" autocomplete="off" placeholder="Поиск: AKR, Karambit, Dragon…"><div class="toolbar"><select id="category"><option value="">Все категории</option></select><button id="favfilter">☆ Избранное</button><button id="chosenfilter">✓ Выбрано</button></div></header><div class="stat" id="stats"></div><div class="grid" id="grid"></div><div id="drawer"><div id="detail"></div></div><script src="catalog.js"></script><script>
'use strict';const catalog=window.HUNTARES_CATALOG;const items=catalog.items;const byId=(id)=>document.getElementById(id);const category=byId('category'),grid=byId('grid'),search=byId('search');let favOnly=false,chosenOnly=false,selected=-1,offset=0,filtered=[];const BATCH=100;const load=(key)=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch(e){return {}}};let favs=load('favorites-v1'),picks=load('selections-v1');const store=()=>{localStorage.setItem('favorites-v1',JSON.stringify(favs));localStorage.setItem('selections-v1',JSON.stringify(picks))};for(const c of catalog.categories){const opt=document.createElement('option');opt.value=c;opt.textContent=c;category.appendChild(opt)}function iconStyle(e){return `background-image:url('atlases/${String(e.atlas).padStart(2,'0')}.webp');background-position:-${e.ox}px -${e.oy}px`};function makeTile(index){const e=items[index],div=document.createElement('div');div.className='tile'+(picks[e.category]===index?' chosen':'');div.innerHTML=`<button class="favorite ${favs[index]?'on':''}" aria-label="Избранное">${favs[index]?'★':'☆'}</button><div class="thumb" style="${iconStyle(e)}"></div><div class="caption"><div class="name"></div><div class="cat"></div><div class="id"></div></div>`;div.querySelector('.name').textContent=e.name;div.querySelector('.cat').textContent=e.category;div.querySelector('.id').textContent=e.icon_id===null?'ID: не сопоставлен':'ID иконки: '+e.icon_id;div.querySelector('button').onclick=ev=>{ev.stopPropagation();favs[index]=!favs[index];store();ev.currentTarget.textContent=favs[index]?'★':'☆';ev.currentTarget.classList.toggle('on',!!favs[index])};div.onclick=()=>detail(index);return div}function renderMore(){let end=Math.min(offset+BATCH,filtered.length),frag=document.createDocumentFragment();for(let i=offset;i<end;i++)frag.appendChild(makeTile(filtered[i]));grid.appendChild(frag);offset=end}function filter(){const q=search.value.trim().toLowerCase(),c=category.value;filtered=[];for(let i=0;i<items.length;i++){let e=items[i];if(c&&e.category!==c)continue;if(favOnly&&!favs[i])continue;if(chosenOnly&&picks[e.category]!==i)continue;if(q&&!(`${e.category} ${e.name} ${e.symbol} ${e.icon_id??''}`.toLowerCase().includes(q)))continue;filtered.push(i)}offset=0;grid.textContent='';byId('stats').textContent=`Найдено ${filtered.length} / ${items.length} · Сопоставлено ID: ${items.filter(x=>x.icon_id!==null).length}`;renderMore();if(!filtered.length)grid.innerHTML='<div class="empty">Ничего не найдено</div>'}function detail(index){selected=index;let e=items[index],d=byId('detail');d.replaceChildren();const h=document.createElement('h2'),p=document.createElement('p'),b=document.createElement('button'),cl=document.createElement('button');h.textContent=e.name;p.textContent=`${e.category} · ${e.symbol} · ${e.icon_id===null?'ID не найден':`ID иконки: ${e.icon_id}`}`;b.className='primary';b.textContent=picks[e.category]===index?'Снять выбор':'Выбрать в каталоге';b.onclick=()=>{if(picks[e.category]===index)delete picks[e.category];else picks[e.category]=index;store();byId('drawer').classList.remove('show');filter()};cl.textContent='Закрыть';cl.onclick=()=>byId('drawer').classList.remove('show');const tip=document.createElement('p');tip.className='small';tip.textContent='Выбор сохраняется в галерее, но не применяет скин в онлайн-игре.';d.append(h,p,b,cl,tip);byId('drawer').classList.add('show')}byId('drawer').onclick=e=>{if(e.target.id==='drawer')e.currentTarget.classList.remove('show')};search.oninput=filter;category.onchange=filter;byId('favfilter').onclick=()=>{favOnly=!favOnly;byId('favfilter').style.borderColor=favOnly?'white':'';filter()};byId('chosenfilter').onclick=()=>{chosenOnly=!chosenOnly;byId('chosenfilter').style.borderColor=chosenOnly?'white':'';filter()};window.addEventListener('scroll',()=>{if(window.innerHeight+window.scrollY>=document.body.offsetHeight-650&&offset<filtered.length)renderMore()});filter();</script></body></html>
